<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>William Béchay — Software Engineer</title>
    <meta
      name="description"
      content="Full-stack software engineer building fast, scalable and reliable web and mobile products."
    />

    <!-- L-ancien lien pointait vers /vite.svg, absent de public/ : chaque
         visite demandait une icone qui repondait 404 et l-onglet affichait
         le glyphe par defaut du navigateur. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- La barre d-adresse mobile prend la couleur de la barre de nav,
         par theme, pour que la page ne commence pas sur une coupure. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfdfe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13151c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Le theme est pose AVANT le premier rendu, et non dans un effet React.
         L-attribut class="dark" ci-dessus est le repli sans JavaScript ; un
         visiteur ayant choisi le theme clair voyait sinon une page sombre
         pendant tout le chargement du bundle, puis un basculement en blanc.
         Ce script est volontairement inline : un fichier separe serait une
         requete de plus, donc un flash de plus. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var r = document.documentElement;
          r.classList.remove('light', 'dark');
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {
          /* stockage bloque : on garde le repli sombre du HTML */
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="William Béchay — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack software engineer building fast, scalable and reliable web and mobile products."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
