<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="William Bechay">
  <!-- Le W est un trace ouvert et non une lettre remplie : a 16px, la
       taille reelle d-un onglet, les contre-formes d-un W plein se
       referment et la marque devient une tache. -->
  <rect width="64" height="64" rx="15" fill="#0c0e12"/>
  <rect x=".7" y=".7" width="62.6" height="62.6" rx="14.3" fill="none" stroke="#8c98a6" stroke-opacity=".55" stroke-width="1.4"/>
  <path d="M14 19 L23.5 45 L32 30 L40.5 45 L50 19"
        fill="none" stroke="#ffffff" stroke-width="7.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
