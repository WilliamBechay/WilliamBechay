<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#131b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(204,82%,58%)"/>
      <stop offset="100%" stop-color="hsl(168,50%,56%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="hsl(204,82%,58%)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="hsl(204,82%,58%)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.045)" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="338" x2="800" y2="338"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  <!-- shield icon -->
  <g transform="translate(400,150)">
    <path d="M0 -55 L46 -35 V10 C46 45 24 68 0 78 C-24 68 -46 45 -46 10 V-35 Z"
      fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-16 4 L-4 18 L20 -14" fill="none" stroke="url(#accent)" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
    font-size="46" font-weight="700" fill="#f4f6f8" letter-spacing="1">NexFend</text>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
    font-size="16" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Agents de sécurité licenciés × Employeurs</text>
  <rect x="330" y="330" width="140" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
